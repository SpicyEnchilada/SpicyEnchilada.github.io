<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Store | Blastonia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-card: #181b22;
            --bg-card-hover: #222733;
            --primary-orange: #ff5500;
            --primary-orange-hover: #ff7722;
            --text-light: #e6e6e6;
            --text-muted: #9a9eab;
            --accent-border: #333a4d;
            --font-heading: 'Teko', sans-serif;
            --font-subheading: 'Rajdhani', sans-serif;
            --font-body: 'Open Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: var(--font-body); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header { background: rgba(15, 17, 21, 0.95); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid var(--accent-border); }
        nav { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .logo { font-family: var(--font-heading); font-size: 2.2rem; letter-spacing: 2px; color: #fff; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .logo-coin { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-orange); }
        .logo span { color: var(--primary-orange); }

        .nav-links { display: flex; list-style: none; gap: 20px; align-items: center; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-family: var(--font-subheading); font-weight: 600; font-size: 1.1rem; text-transform: uppercase; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-orange); }

        .page-section { padding: 140px 0 80px; flex: 1; }
        .section-title { text-align: center; margin-bottom: 50px; }
        .section-title h1 { font-family: var(--font-heading); font-size: 3.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .section-title p { color: var(--text-muted); font-size: 1.2rem; }

        .store-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        
        .product-card { background: var(--bg-card); border: 1px solid var(--accent-border); border-radius: 8px; overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--primary-orange); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .product-image-wrap { width: 100%; height: 260px; background-color: #12141a; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .product-image-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .product-card:hover .product-image-wrap img { transform: scale(1.05); }

        .product-details { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .product-title { font-family: var(--font-subheading); font-size: 1.4rem; text-transform: uppercase; color: #fff; margin-bottom: 8px; }
        .product-description { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; flex: 1; line-height: 1.4; }
        
        .product-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 15px; border-top: 1px solid var(--accent-border); }
        .product-price { font-family: var(--font-heading); font-size: 1.8rem; color: var(--primary-orange); }
        
        .btn-buy { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background-color: var(--primary-orange); color: #fff; font-family: var(--font-subheading); font-weight: 700; text-transform: uppercase; text-decoration: none; border-radius: 4px; transition: background 0.3s ease; }
        .btn-buy:hover { background-color: var(--primary-orange-hover); }

        .loading-text { text-align: center; color: var(--text-muted); font-size: 1.2rem; grid-column: 1 / -1; padding: 40px; }

        footer { padding: 40px 0; text-align: center; border-top: 1px solid var(--accent-border); color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <img src="icon.jpg" alt="Blastonia Coin" class="logo-coin">
                    <span>Blastonia.com</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="features.html">Features</a></li>
                    <li><a href="join.html">How To Join</a></li>
                    <li><a href="store.html" class="active">Store</a></li>
                    <li><a href="discord.html">Discord</a></li>
                    <li><a href="patreon.html">Patreon</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="page-section">
        <div class="container">
            <div class="section-title">
                <h1>Official Merch Store</h1>
                <p>Gear up with official Blastonia apparel, mugs, and survival accessories.</p>
            </div>

            <div class="store-grid" id="product-container">
                <div class="loading-text">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-orange); margin-bottom: 10px;"></i>
                    <p>Loading Store Items...</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Blastonia.com. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Set this URL to point to your backend proxy serverless endpoint
        // Example: 'https://api.blastonia.com/get-printify-products' or 'https://your-worker.workers.dev/products'
        const API_ENDPOINT = ''; 

        // Sample fallback products if API endpoint is not set up yet
        const sampleProducts = [
            {
                title: "Blastonia Survivor Hoodie",
                description: "Heavyweight survival hoodie featuring the official Blastonia emblem.",
                price: "$45.00",
                image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80",
                externalUrl: "https://www.patreon.com/Blastoniagaming"
            },
            {
                title: "Blastonia Tactical Cap",
                description: "Durable embroidered cap built for endless horde nights.",
                price: "$24.99",
                image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=600&q=80",
                externalUrl: "https://www.patreon.com/Blastoniagaming"
            },
            {
                title: "Blastonia Coffee Mug (15oz)",
                description: "Start your morning craft session with hot coffee in a custom ceramic mug.",
                price: "$16.50",
                image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80",
                externalUrl: "https://www.patreon.com/Blastoniagaming"
            }
        ];

        async function loadProducts() {
            const container = document.getElementById('product-container');

            if (API_ENDPOINT) {
                try {
                    const response = await fetch(API_ENDPOINT);
                    const products = await response.json();
                    renderProducts(products);
                } catch (err) {
                    console.error("Failed to load products from Printify API Proxy:", err);
                    container.innerHTML = `<p class="loading-text">Unable to load live store items right now. Please check back later!</p>`;
                }
            } else {
                // Render sample/fallback catalog if endpoint isn't connected yet
                renderProducts(sampleProducts);
            }
        }

        function renderProducts(items) {
            const container = document.getElementById('product-container');
            container.innerHTML = '';

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image-wrap">
                        <img src="${product.image || product.images[0]?.src}" alt="${product.title}">
                    </div>
                    <div class="product-details">
                        <h3 class="product-title">${product.title}</h3>
                        <p class="product-description">${product.description || ''}</p>
                        <div class="product-bottom">
                            <span class="product-price">${product.price || '$' + (product.variants?.[0]?.price / 100).toFixed(2)}</span>
                            <a href="${product.externalUrl || '#'}" target="_blank" class="btn-buy">
                                <i class="fa-solid fa-cart-shopping"></i> Buy Now
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>

</body>
</html>
